name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # extra `temporal` : couvre les définitions enregistrées par `synelia worker`
      - run: uv run --frozen --extra temporal pytest -q
      - name: Couverture du contrat
        run: uv run python tools/contrat_diff.py --strict
      - name: Image Docker
        run: docker build -t synelia-cloud-backend:ci .

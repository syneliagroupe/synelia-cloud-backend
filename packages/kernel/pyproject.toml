[project]
name = "synelia-kernel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24",
  "uuid-utils>=0.9",
  "cryptography>=43",
  "orjson>=3.10",
  "premailer>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synelia_kernel"]

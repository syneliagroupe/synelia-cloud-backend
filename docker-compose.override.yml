# Local lab overlay: inject .env into api+worker; keep Real OpenStack + connectors.
# Preserves Cloud Platform openstack wiring; adds MinIO/Zimbra/relais SMTP.
#
# `restart: unless-stopped` on every service below: vm-admin has rebooted twice
# in one night unprompted (not an OOM, not a deliberate stop — see TODO.md
# 2026-09-22 nuit) and none of these had a restart policy, so every reboot
# meant a manual `docker compose up -d` before the stack answered again.
services:
  postgres:
    restart: unless-stopped
  valkey:
    restart: unless-stopped
  temporal:
    restart: unless-stopped
  temporal-ui:
    restart: unless-stopped
  mailpit:
    restart: unless-stopped
  api:
    restart: unless-stopped
    env_file: .env
    environment:
      SYNELIA_FOURNISSEUR: openstack
      SYNELIA_OS_AUTH_URL: http://192.168.26.234:5000/v3
      SYNELIA_OS_REGION: RegionOne
      SYNELIA_MINIO_URL: http://minio:9000
      SYNELIA_ZIMBRA_URL: https://zimbra:7071
      SYNELIA_RELAIS_SMTP_HOTE: relais-smtp
      SYNELIA_RELAIS_SMTP_PORT: "587"
      SYNELIA_LITELLM_URL: http://litellm:4000
    depends_on:
      litellm:
        condition: service_started
  worker:
    restart: unless-stopped
    env_file: .env
    environment:
      SYNELIA_FOURNISSEUR: openstack
      SYNELIA_OS_AUTH_URL: http://192.168.26.234:5000/v3
      SYNELIA_OS_REGION: RegionOne
      SYNELIA_MINIO_URL: http://minio:9000
      SYNELIA_ZIMBRA_URL: https://zimbra:7071
      SYNELIA_RELAIS_SMTP_HOTE: relais-smtp
      SYNELIA_RELAIS_SMTP_PORT: "587"
      SYNELIA_LITELLM_URL: http://litellm:4000
    depends_on:
      litellm:
        condition: service_started
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    environment:
      SYNELIA_OPENROUTER_KEY: ${SYNELIA_OPENROUTER_KEY:?}
      SYNELIA_LITELLM_MASTER_KEY: ${SYNELIA_LITELLM_MASTER_KEY:?}
    volumes: ["./litellm/config.yaml:/app/config.yaml:ro"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
  relais-smtp:
    env_file: .env
    environment:
      SYNELIA_DATABASE_URL: postgresql+asyncpg://synelia:synelia@postgres:5432/synelia
      SYNELIA_SMTP_RELAIS_HOTE: "0.0.0.0"
      SYNELIA_SMTP_RELAIS_PORT: "587"
      SYNELIA_SMTP_RELAIS_AMONT_HOTE: zimbra
      SYNELIA_SMTP_RELAIS_AMONT_PORT: "587"
    networks:
      default:
        aliases: [relais-smtp]
    restart: unless-stopped

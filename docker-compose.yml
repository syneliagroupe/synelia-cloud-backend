name: synelia-cloud-backend

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: synelia
      POSTGRES_PASSWORD: synelia
      POSTGRES_DB: synelia
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synelia"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]

  temporal:
    image: temporalio/auto-setup:1.28
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: synelia
      POSTGRES_PWD: synelia
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:2.34.0
    environment: { TEMPORAL_ADDRESS: temporal:7233 }
    ports: ["8233:8080"]

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  api:
    build: .
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      SYNELIA_ENV: local
      SYNELIA_DATABASE_URL: postgresql+asyncpg://synelia:synelia@postgres:5432/synelia
      SYNELIA_TEMPORAL_ADRESSE: temporal:7233
      SYNELIA_VALKEY_URL: redis://valkey:6379/0
    ports: ["4000:4000"]

  worker:
    build: .
    command: ["worker"]
    depends_on: [api, temporal]
    environment:
      SYNELIA_DATABASE_URL: postgresql+asyncpg://synelia:synelia@postgres:5432/synelia
      SYNELIA_TEMPORAL_ADRESSE: temporal:7233

  relais-smtp:
    build: .
    command: ["relais-smtp"]
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      SYNELIA_DATABASE_URL: postgresql+asyncpg://synelia:synelia@postgres:5432/synelia
      SYNELIA_SMTP_RELAIS_HOTE: "0.0.0.0"
      SYNELIA_SMTP_RELAIS_PORT: "587"
      # En local, l'amont est Mailpit (aucune auth, tout est accepté) : pratique pour vérifier
      # de bout en bout AUTH + quota + relais sans dépendre de Zimbra.
      SYNELIA_SMTP_RELAIS_AMONT_HOTE: mailpit
      SYNELIA_SMTP_RELAIS_AMONT_PORT: "1025"
    ports: ["587:587"]

volumes:
  pgdata: {}

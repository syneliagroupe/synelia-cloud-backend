name: synelia-zimbra-dev01

services:
  dns-server:
    image: 4km3/dnsmasq
    container_name: zimbra-dnsmasq
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    command: --address=/zimbra.synelia.internal/172.30.0.2 --domain=zimbra.synelia.internal --mx-host=zimbra.synelia.internal,mail.zimbra.synelia.internal,0
    networks:
      zimbranet:
        ipv4_address: 172.30.0.2

  zimbra:
    image: iwayvietnam/zimbra_all:latest
    container_name: zimbra-all
    hostname: mail.zimbra.synelia.internal
    dns: [172.30.0.2, 8.8.8.8]
    depends_on: [dns-server]
    volumes:
      - ./zimbra-storage:/opt/zimbra:rw
    environment:
      - PASSWORD=${ZIMBRA_ADMIN_PASSWORD:?}
    # Native image CMD is /bin/bash /opt/build.sh -d. On container recreate the
    # image still contains install-autoKeys (so it would reinstall) and has no
    # zimbra/postfix users (those lived in the previous container layer).
    # Minimal bootstrap: recreate UIDs matching this volume, then let native
    # build.sh take the already-installed branch (rsyslogd + zmcontrol restart).
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -e
        if [ -x /opt/zimbra/bin/zmcontrol ]; then
          getent group zimbra >/dev/null || groupadd -o -g 997 zimbra
          getent group postdrop >/dev/null || groupadd -o -g 993 postdrop
          getent group postfix >/dev/null || groupadd -o -g 997 postfix || true
          getent passwd zimbra >/dev/null || useradd -o -u 998 -g zimbra -M -d /opt/zimbra -s /bin/bash zimbra
          getent passwd postfix >/dev/null || useradd -o -u 997 -g zimbra -M -d /opt/zimbra/data/postfix -s /sbin/nologin postfix || true
          usermod -a -G postdrop postfix 2>/dev/null || true
          usermod -a -G postdrop zimbra 2>/dev/null || true
          if ! command -v sudo >/dev/null 2>&1; then
            yum install -y sudo 2>/dev/null || microdnf install -y sudo 2>/dev/null || dnf install -y sudo || true
          fi
          mkdir -p /etc/sudoers.d
          echo "zimbra ALL=NOPASSWD: ALL" > /etc/sudoers.d/zimbra
          chmod 440 /etc/sudoers.d/zimbra
          if [ ! -e /lib64/libaio.so.1 ]; then
            yum install -y libaio 2>/dev/null || microdnf install -y libaio 2>/dev/null || dnf install -y libaio || true
            ldconfig 2>/dev/null || true
          fi
          rm -rf /opt/zimbra-install
        else
          # KNOWN GAP: this only carries over the hostname/LDAP patches. A true
          # fresh install (empty ./zimbra-storage) also needs the 4 fixes
          # documented in zimbra/fix/build.sh (FIPS-disabled openssl.cnf,
          # jetty-setuid jar symlink, amavisd StartTLS verify=none, JDK 17
          # --add-opens) — those are NOT applied here. That directory now
          # builds nothing (this container runs the stock image), but keep it
          # as the reference for whoever next does a disaster-recovery
          # reinstall; port the relevant `sed`/`cp`/`ln` lines in before
          # `zmsetup.pl` runs, not after.
          sed -i 's/HOSTNAME=$(hostname -a)/HOSTNAME=$(hostname -s)/' /opt/build.sh
          sed -i 's/LDAPSERVERID="2"/LDAPSERVERID="1"/g' /opt/build.sh
        fi
        exec /bin/bash /opt/build.sh -d
    ports:
      - "127.0.0.1:25:25"
      - "127.0.0.1:587:587"
      - "127.0.0.1:465:465"
      - "127.0.0.1:110:110"
      - "127.0.0.1:143:143"
      - "127.0.0.1:993:993"
      - "127.0.0.1:995:995"
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
      - "127.0.0.1:3443:3443"
      - "127.0.0.1:9071:7071"
    networks:
      zimbranet:
        ipv4_address: 172.30.0.3
      backend:
        aliases: [zimbra]
    restart: unless-stopped

networks:
  zimbranet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    name: synelia-cloud-backend_default
    external: true

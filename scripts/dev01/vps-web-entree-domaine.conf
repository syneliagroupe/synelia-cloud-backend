# Entrée publique Web Cloud pour domaines clients (DNS A / wildcard CNAME → dev01).
# Octavia route ensuite par en-tête Host() vers le pool VPS (cf. vps-wildcard.conf pour
# *.cloud.dev01.ovh.smile.ci uniquement).
#
# Déployer sur dev01 (hyperviseur 198.244.179.212) :
#   VPS_ZONE_LB_FIP=192.168.20.224 DEMO_DOMAIN=demo-28d14e3a.com \
#     ./scripts/dev01/install-vps-web-entree-domaine.sh
#
# Remplacer DEMO_DOMAIN / ServerAlias par le domaine client ; LB FIP = FIP Octavia vps-zone-lb.

<VirtualHost *:80>
  ServerName __DEMO_DOMAIN__
  ServerAlias *.__DEMO_DOMAIN__

  # ACME http-01 (certbot --webroot) — avant tout ProxyPass /
  Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
  ProxyPass /.well-known !

  ProxyPreserveHost On
  ProxyPass        / http://__LB_FIP__:80/ connectiontimeout=5 timeout=120 retry=0
  ProxyPassReverse / http://__LB_FIP__:80/
  <Directory /var/www/html/.well-known/acme-challenge/>
    Require all granted
  </Directory>
</VirtualHost>

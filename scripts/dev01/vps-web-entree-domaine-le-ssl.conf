# HTTPS pour domaine client Web Cloud — cert Let's Encrypt (scripts/dev01/install-vps-web-entree-domaine.sh).

<VirtualHost *:443>
  ServerName __DEMO_DOMAIN__
  ServerAlias *.__DEMO_DOMAIN__

  SSLEngine on
  SSLCertificateFile /etc/letsencrypt/live/__DEMO_DOMAIN__/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/__DEMO_DOMAIN__/privkey.pem

  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Port "443"
  Header edit Location "^http://(.*)$" "https://$1"

  ProxyPreserveHost On
  ProxyPass        / http://__LB_FIP__:80/ connectiontimeout=5 timeout=120 retry=0
  ProxyPassReverse / http://__LB_FIP__:80/
</VirtualHost>
